name: build

# 每次 push 到 main / PR 都编译一遍（防止"本地能过、别人拉下来编不过"）；
# 打与 version 文件一致的 v* tag 时发布固件。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (esp-idf v6.1)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
      # 容器里默认是 root，显式声明免得 mount 出来的工作区没有写权限
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Validate project version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < version)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Invalid version file" >&2; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag must match v${version} from the version file" >&2
            exit 1
          fi

      # 组件管理器要拉 LVGL 和 Waveshare 的 BSP，缓存能省下几分钟
      - name: Cache component manager
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: idf-${{ hashFiles('main/idf_component.yml', 'components/*/idf_component.yml', 'dependencies.lock') }}
          restore-keys: idf-

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh >/dev/null
          echo "IDF: $(idf.py --version)"
          idf.py set-target esp32s3
          idf.py build 2>&1 | tee build.log
          echo "--- 告警统计 ---"
          grep -c "warning:" build.log || echo "0 warning"

      - name: Firmware size
        run: |
          ls -l build/esp32s3_netkeeper.bin
          python3 -c "import os;print('app: %.2f MB' % (os.path.getsize('build/esp32s3_netkeeper.bin')/1048576))"

      - name: Verify firmware version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          image = Path('build/esp32s3_netkeeper.bin').read_bytes()
          expected = Path('version').read_text().strip()
          if image[32:36] != bytes.fromhex('3254cdab'):
              raise SystemExit('ESP application description not found')
          actual = image[48:80].split(b'\0', 1)[0].decode('ascii')
          if actual != expected:
              raise SystemExit(f'Firmware version {actual!r} does not match {expected!r}')
          print(f'Firmware version: {actual}')
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-netkeeper-${{ github.sha }}
          path: |
            build/esp32s3_netkeeper.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
            build.log
          retention-days: 30
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: esp32s3-netkeeper-${{ github.sha }}
          path: firmware

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r\n' < version)
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          base = Path('firmware/build')
          with ZipFile('esp32s3-netkeeper-firmware.zip', 'w', ZIP_DEFLATED) as archive:
              for name in ('esp32s3_netkeeper.bin', 'bootloader/bootloader.bin', 'partition_table/partition-table.bin', 'flash_args'):
                  archive.write(base / name, name)
          PY
          cat > release-notes.md <<EOF
          ## 固件下载

          下载固件压缩包并解压，包含应用固件、bootloader、分区表和 flash_args。
          固件和源码对应提交 \`${GITHUB_SHA}\`，由 [Actions 构建](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})生成。

          > 烧录时 flash-mode 必须用 dio；详情见 README「编译与烧录」。

          更新记录见仓库中的 CHANGELOG.md。
          EOF

          tag_path=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["GITHUB_REF_NAME"], safe=""))')
          if gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${tag_path}" > /tmp/release-response 2> /tmp/release-error; then
            gh release edit "$GITHUB_REF_NAME" --title "esp32s3-netkeeper v${version}" --notes-file release-notes.md
          elif grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' /tmp/release-response; then
            gh release create "$GITHUB_REF_NAME" --title "esp32s3-netkeeper v${version}" --notes-file release-notes.md --verify-tag
          elif ! grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' /tmp/release-response; then
            cat /tmp/release-error >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            esp32s3-netkeeper-firmware.zip firmware/build/esp32s3_netkeeper.bin \
            firmware/build/bootloader/bootloader.bin firmware/build/partition_table/partition-table.bin
